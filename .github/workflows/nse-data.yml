# NSE data jobs: sectors for holdings and daily index history.
#
# Run from Actions → "NSE data" → Run workflow, choosing the job:
#   probe     can GitHub's servers download NSE's files? Writes nothing. Run this first.
#   sectors   refresh industry_map and index_constituents from NSE's index lists (also weekly)
#   backfill  fill 3 years of index_prices (≈15 minutes; resumable, safe to re-run)
#   stocks    fill 3 years of stock_prices for index constituents (≈30 minutes; resumable, re-run if it times out)
#   rotation  print this week's rotation quadrants from index_prices (reads only)
#   breadth   recompute every rotation score (with the steady labels), then breadth and the
#             market regime for every week in 3 years (≈5 minutes). Run once after Day 4 merges
#   backtest  score the regime rule's thresholds against the 3 years of saved weeks (reads only;
#             the table appears in the run summary). Needs `breadth` to have run first
#   alignment rewrite every week of your alignment and the market's from the saved holdings
#             snapshots and rotation scores (≈1 minute). Run once after Week 3 Day 1 merges
#   holdings-prices  3 years of prices for stocks you hold that aren't in any tracked index
#             (only stocks with no saved history; ≈20 minutes), then recompute concentration and RSI
#   financials  results filings (EPS, book value, cash flow) for every stock anyone holds, from
#             NSE's XBRL files (≈15 minutes the first time; resumable; also every Sunday), then
#             recompute the valuation views
#   refill    after adding indices to tracked_indices: download 3 years again for all of them,
#             then recompute every rotation score (≈15 minutes)
#
# Needs the repository secret SUPABASE_SECRET_KEY (Supabase → Project settings → API Keys →
# Secret keys). It stays in GitHub; Cloud Run and the web app never see it.
name: NSE data

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [probe, sectors, backfill, stocks, rotation, breadth, backtest, alignment, holdings-prices, financials, refill]
        default: probe
      years:
        description: Years of history for backfill
        default: "3"
      benchmark:
        description: Benchmark for rotation
        type: choice
        options: [nifty-500, nifty-50, nifty-midcap-150, nifty-smallcap-250]
        default: nifty-500
  schedule:
    - cron: "30 2 * * 0"   # Sundays 08:00 IST: refresh sectors (NSE updates constituents twice a year, plus new listings) and new results filings

concurrency:
  group: nse-data
  cancel-in-progress: false

env:
  SUPABASE_URL: https://dgjbladcfysjncciukhg.supabase.co

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt

      - name: Probe NSE access
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'probe'
        working-directory: jobs
        run: python probe_nse.py

      - name: Import sectors
        if: github.event_name == 'schedule' || inputs.job == 'sectors'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python import_sectors.py
          python import_constituents.py

      - name: Backfill stock prices
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'stocks'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YEARS: ${{ inputs.years }}
        run: python backfill_stock_prices.py --years "$YEARS"

      - name: Backfill index prices
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'backfill'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YEARS: ${{ inputs.years }}
        run: python backfill_index_prices.py --years "$YEARS"

      - name: Rotation table
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'rotation'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BENCHMARK: ${{ inputs.benchmark }}
        run: python rotation_table.py --benchmark "$BENCHMARK"

      - name: Refill index prices and rotation scores
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'refill'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YEARS: ${{ inputs.years }}
        run: |
          python backfill_index_prices.py --years "$YEARS" --refill
          python compute_rotation.py --full
          python compute_breadth.py --full

      - name: Rotation, breadth and regime for every week
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'breadth'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python compute_rotation.py --full
          python compute_breadth.py --full

      - name: Backtest the regime rule
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'backtest'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python backtest_regime.py

      - name: Alignment for every week
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'alignment'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python compute_alignment.py --full

      - name: Prices for held stocks outside the indices
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'holdings-prices'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python backfill_stock_prices.py --years 3 --new-only
          python compute_concentration.py
          python compute_indicators.py

      - name: Results filings for held stocks, then valuation views
        if: github.event_name == 'schedule' || inputs.job == 'financials'
        working-directory: jobs
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python import_financials.py
          python compute_valuations.py
