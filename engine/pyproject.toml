[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-xray-engine"
version = "0.1.0"
description = "Fund X-Ray calculations: holdings, sectors, rotation, alignment, health checks. No UI code."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fund_xray_engine*"]
